name: Server CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'radin/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Build production server
        run: npm run build
